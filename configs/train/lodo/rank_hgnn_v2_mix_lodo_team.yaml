memory:
  type: hypergraph
  embedder:
    type: st
    model_name: Qwen/Qwen3-Embedding-0.6B
    batch_size: 16
    max_seq_length: 1024
  extractor:
    type: heuristic
  n_seeds: 30
  max_candidates: 300
  max_edge_size: 60
  version_keep_k: 5
  link_df_window: 500
  scorer:
    type: fixed
  idf_scope: view
k:
- 5
- 10
datasets:
- label: StateBench v1 test
  domain: team
  name: jarvis
  path: data/stress/statebench_test.json
- label: SB2 team test
  domain: team
  name: jarvis
  path: data/stress/statebench_v2_team_test.json
arms:
  hgnn_v2_mix_lodo_team:
  - models/hgnn/hgnn_v2_mix_lodo_team*.pt
lodo:
  held_out_domain: team
  source: configs/train/hgnn_v2_mix.yaml
