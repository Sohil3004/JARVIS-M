# Ranking tables on synthetic + real data (no reader / judge):
#   jarvis-eval data make-stress --split test --n 300 ; jarvis-eval data fetch locomo ; jarvis-eval data fetch longmemeval
#   jarvis-eval rank-eval configs/eval/rank_real.yaml --arm hgnn_v2=models/hgnn/hgnn_v2_s{0,1,2}.pt
# Every dataset entry names its domain (team | assistant | personal | enterprise): rank-eval reports
# per dataset, per domain and the macro-average over domains.
# Use the embedder the checkpoints were trained with (hypergraph_base.yaml).
base: ../hypergraph_base.yaml
k: [5, 10]
datasets:
  - {label: StateBench test, domain: team, name: jarvis, path: data/stress/statebench_test.json}
  - {label: LoCoMo, domain: personal, name: locomo, categories: [single_hop, multi_hop, temporal, open_domain]}
  - {label: LongMemEval-S test (stratified 20%), domain: assistant, name: longmemeval, variant: s_cleaned, split: test}
